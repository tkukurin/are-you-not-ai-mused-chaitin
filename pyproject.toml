[project]
name = "aimused"
version = "0.1.0"
description = "Museable — a group chat that grows personal interfaces and merges them (Street Feast demo + live Muse Glimmer app)."
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.1,<2.0",
]

[project.scripts]
demo = "run:demo"
app = "run:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run"]
